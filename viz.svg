<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Trick: the longest palindromic prefix of s = the longest prefix of s that is a</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">suffix of reverse(s). Build t = s + '#' + reverse(s) and take the last LPS value: 7.</text>
<text x="72.0" y="251.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">KMP reuse</text>
