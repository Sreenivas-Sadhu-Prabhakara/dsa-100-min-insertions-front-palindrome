<text x="56.0" y="301.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Answer: 8 − 7 = 1 insertion (one 'a' in front). The '#' separator matters — without</text>
<text x="56.0" y="320.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">it the LPS could overrun the boundary and overcount.</text>
