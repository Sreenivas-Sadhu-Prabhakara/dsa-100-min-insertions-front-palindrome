<text x="174.0" y="251.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">t → s # reverse(s)</text>
<rect x="274.0" y="232.0" width="171.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="359.5" y="251.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">last LPS of t → 7</text>
